databaseChangeLog:
  - changeSet:
      id: 1
      author: you
      runOnChange: true
      changes:
        - createTable:
            tableName: prrroducts
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: description
                  type: text
              - column:
                  name: price
                  type: double precision
              - column:
                  name: quantity
                  type: integer
  - changeSet:
      id: 2
      author: you
      changes:
        - renameTable:
            oldTableName: prrroducts
            newTableName: products